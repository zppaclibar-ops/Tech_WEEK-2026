<!DOCTYPE html>
<html>
<head>
    <title>Tech Week 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0E27;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .box {
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid #00F0FF;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #00F0FF; font-size: 40px; margin-bottom: 10px; }
        p { color: #8892b0; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #00F0FF;
            background: #0A0E27;
            color: white;
            font-size: 16px;
        }
        button {
            background: #FF0080;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 5px;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); }
        .btn-blue { background: #00F0FF; color: #0A0E27; }
        #status { color: #00F0FF; margin: 15px 0; }
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #12163a;
            border: 1px solid #00F0FF;
            padding: 15px 25px;
            border-radius: 12px;
            display: none;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>

    <div class="box">
        <h1>🚀 TECH WEEK 2026</h1>
        <p>Register now for the biggest tech event!</p>

        <div id="status">👤 Guest</div>

        <div id="signupForm">
            <input type="text" id="fullName" placeholder="Full Name" />
            <input type="email" id="email" placeholder="Email" />
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password (min 6 chars)" />
            <input type="text" id="school" placeholder="School" />
            <button onclick="register()">✅ REGISTER</button>
        </div>

        <div id="loginForm" class="hidden">
            <input type="text" id="loginUsername" placeholder="Username" />
            <input type="password" id="loginPassword" placeholder="Password" />
            <button onclick="login()">🔐 LOGIN</button>
        </div>

        <div style="margin-top:15px;">
            <button class="btn-blue" onclick="showLogin()">🔐 Login</button>
            <button class="btn-blue" onclick="showSignup()">📝 Sign Up</button>
            <button onclick="viewAll()">📋 View All</button>
            <button id="logoutBtn" class="hidden" onclick="logout()" style="background:#ff4444;">🚪 Logout</button>
        </div>

        <div id="message" style="margin-top:15px; color:#FF0080;"></div>
    </div>

    <div class="toast" id="toast"><div id="toastMsg">✅ Done!</div></div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function register() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const school = document.getElementById('school').value.trim();

            if (!fullName || !email || !username || !password || !school) {
                document.getElementById('message').textContent = '⚠️ Please fill in all fields!';
                return;
            }
            if (password.length < 6) {
                document.getElementById('message').textContent = '⚠️ Password must be at least 6 characters!';
                return;
            }

            let users = JSON.parse(localStorage.getItem('techweek_users') || '[]');

            for (let i = 0; i < users.length; i++) {
                if (users[i].username === username) {
                    document.getElementById('message').textContent = '⚠️ Username already taken!';
                    return;
                }
                if (users[i].email === email) {
                    document.getElementById('message').textContent = '⚠️ Email already registered!';
                    return;
                }
            }

            const newUser = { fullName, email, username, password, school };
            users.push(newUser);
            localStorage.setItem('techweek_users', JSON.stringify(users));
            localStorage.setItem('techweek_current_user', JSON.stringify(newUser));

            document.getElementById('message').textContent = '✅ Welcome ' + fullName + '! You are registered!';
            showToast('✅ Welcome ' + fullName + '!');
            updateUI();
            clearInputs();
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                document.getElementById('message').textContent = '⚠️ Please enter username and password!';
                return;
            }

            let users = JSON.parse(localStorage.getItem('techweek_users') || '[]');

            for (let i = 0; i < users.length; i++) {
                if (users[i].username === username && users[i].password === password) {
                    localStorage.setItem('techweek_current_user', JSON.stringify(users[i]));
                    document.getElementById('message').textContent = '✅ Welcome back, ' + users[i].fullName + '!';
                    showToast('✅ Welcome back, ' + users[i].fullName + '!');
                    updateUI();
                    return;
                }
            }
            document.getElementById('message').textContent = '❌ Invalid username or password!';
        }

        function logout() {
            localStorage.removeItem('techweek_current_user');
            document.getElementById('message').textContent = '👋 Logged out!';
            showToast('👋 Logged out!');
            updateUI();
        }

        function viewAll() {
            let users = JSON.parse(localStorage.getItem('techweek_users') || '[]');
            if (users.length === 0) {
                document.getElementById('message').textContent = '📋 No registrants yet!';
                return;
            }
            let msg = '📋 REGISTERED USERS (' + users.length + '):\n\n';
            for (let i = 0; i < users.length; i++) {
                msg += (i + 1) + '. ' + users[i].fullName + ' (@' + users[i].username + ')\n';
                msg += '   📧 ' + users[i].email + '\n';
                msg += '   🏫 ' + users[i].school + '\n\n';
            }
            alert(msg);
        }

        function showLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('message').textContent = '';
        }

        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('message').textContent = '';
        }

        function clearInputs() {
            document.getElementById('fullName').value = '';
            document.getElementById('email').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('school').value = '';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function updateUI() {
            const current = JSON.parse(localStorage.getItem('techweek_current_user'));
            if (current) {
                document.getElementById('status').textContent = '👤 ' + current.fullName;
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            } else {
                document.getElementById('status').textContent = '👤 Guest';
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            }
        }

        updateUI();
        document.getElementById('message').textContent = '🚀 Welcome to Tech Week 2026!';
    </script>

</body>
</html>
